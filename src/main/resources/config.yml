# ===================================================
#  WelcomePlugin — config.yml
#  Расположение: plugins/WelcomePlugin/config.yml
# ===================================================
#
#  Поддерживается формат MiniMessage:
#    <gold>текст</gold>                       — именованный цвет
#    <#FF5733>текст</#FF5733>                 — hex-цвет
#    <bold>текст</bold>                       — жирный
#    <italic>текст</italic>                   — курсив
#    <gradient:#FF0000:#0000FF>текст</gradient>
#    <rainbow>текст</rainbow>
#
# ===================================================

message:

  # Большой заголовок в центре экрана
  title: "<gold><bold>Добро пожаловать!</bold></gold>"

  # Подзаголовок под title (оставь пустым "", чтобы не показывать)
  subtitle: "<gray>Рады видеть тебя на нашем сервере!</gray>"

  # Длительность в тиках (20 тиков = 1 секунда)
  fade-in: 10
  stay: 70
  fade-out: 20

  # Строки в чат (отправляются вместе с title)
  lines:
    - "<aqua>Пожалуйста, ознакомься с правилами перед началом игры.</aqua>"
    - "<#FF5733>Важно: нарушение правил = бан.</#FF5733>"
    - ""
    - "<green>Приятной игры!</green>"
