# ===================================================
#  WelcomePlugin — config.yml
#  Расположение: plugins/WelcomePlugin/config.yml
# ===================================================
#
#  Поддерживается формат MiniMessage:
#    <gold>текст</gold>                       — именованный цвет
#    <#FF5733>текст</#FF5733>                 — hex-цвет
#    <bold>текст</bold>                       — жирный
#    <italic>текст</italic>                   — курсив
#    <gradient:#FF0000:#0000FF>текст</gradient>
#    <rainbow>текст</rainbow>
#
#  Максимум строк: 14 (7 слотов × 2 ряда).
#  Пустая строка ("") — пустой слот (пробел между строками).
# ===================================================

message:

  # Заголовок окна (отображается в строке над инвентарём)
  title: "<gold><bold>Добро пожаловать!</bold></gold>"

  # Строки приветственного сообщения
  lines:
    - "<gray>Рады видеть тебя на нашем сервере!</gray>"
    - ""
    - "<aqua>Пожалуйста, ознакомься с правилами</aqua>"
    - "<aqua>перед началом игры.</aqua>"
    - ""
    - "<#FF5733>Важно: нарушение правил = бан.</#FF5733>"
    - ""
    - "<green>Приятной игры!</green>"

  # Кнопка «Понятно» в центре нижнего ряда
  button:
    # Текст на кнопке
    text: "✔ Понятно"
    # Цвет текста (hex)
    color: "#55FF55"
