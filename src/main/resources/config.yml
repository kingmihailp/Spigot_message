# ===================================================
#  WelcomePlugin — config.yml
#  Расположение: plugins/WelcomePlugin/config.yml
# ===================================================
#
#  Поддерживается формат MiniMessage:
#    <gold>текст</gold>            — именованные цвета
#    <#FF5733>текст</#FF5733>      — hex-цвета
#    <bold>текст</bold>            — жирный
#    <italic>текст</italic>        — курсив
#    <underlined>текст</underlined>
#    <gradient:#FF0000:#0000FF>текст</gradient>
#    <rainbow>текст</rainbow>
#
#  Пустая строка ("") добавляет пустую строку в книгу.
# ===================================================

message:

  # Строки приветственного сообщения.
  # Каждая строка — отдельная запись в списке.
  # Количество строк не ограничено.
  lines:
    - "<gold><bold>Добро пожаловать на сервер!</bold></gold>"
    - ""
    - "<gray>Пожалуйста, ознакомьтесь с правилами</gray>"
    - "<gray>перед началом игры.</gray>"
    - ""
    - "<aqua>Приятной игры!</aqua>"
    - ""
    - "<#FF5733>Важное сообщение hex-цветом.</#FF5733>"

  # Настройки кнопки «Понятно»
  button:
    # Текст на кнопке
    text: "[ Понятно ]"

    # Цвет текста кнопки (hex или именованный MiniMessage-цвет без тегов)
    color: "#55FF55"

    # Подсказка при наведении на кнопку
    hover-text: "Нажмите, чтобы закрыть"
